<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DYC Event Reservation</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">

  <style>
    body{
      font-family: 'Instrument Sans', sans-serif;
      background:#f4f1ea;
    }

    .shadow-offset{
      box-shadow: 5px 5px 0 #000;
    }

    .title-script{
      font-family:'Cormorant Garamond', serif;
      font-style:italic;
    }

    .tracking-custom{
      letter-spacing:.18em;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
<nav class="bg-white border-b border-[#B68B40]/20">
    <div class="max-w-7xl mx-auto px-6 py-5">

        <!-- Logo -->
       <!-- LOGO -->
    <a href="/" 
   class="bg-white px-3 py-2 mt-2 rounded-xl shadow-md inline-flex items-center">

  <img src="https://ik.imagekit.io/iuiy6mihw/zenfitlogo1.png?updatedAt=1777298804737"
       alt="ZenFit.ae Logo"
       class="h-10 w-auto">

</a>

    </div>
</nav>

<section class="py-20 bg-white">

    <div class="max-w-4xl mx-auto px-6">

        <!-- Event Title -->
        <div class="mb-10">

            <h1 class="text-4xl md:text-6xl font-black text-[#0B140D] leading-tight">
                DYC Badminton Meetup
            </h1>

            <div class="flex flex-wrap items-center gap-2 mt-4 text-gray-600 uppercase tracking-[0.15em] text-xs md:text-sm">
                <span>📍</span>
                <span>Baseline Sports Academy — DIP Dubai</span>

                <a href="#"
                    class="text-[#0B1F14] font-medium hover:underline">
                    Maps ↗
                </a>
            </div>

        </div>

        <!-- Info Cards -->
        <div class="grid md:grid-cols-3 gap-5 mb-8">

            <!-- Entry Fee -->
            <div class="md:col-span-2 bg-white rounded-[28px] border-2 border-[#0B1F14] p-6 shadow-md">

                <p class="uppercase tracking-[0.2em] text-[11px] text-gray-500 mb-3">
                    Entry Fee
                </p>

                <div class="flex items-end gap-2">

                    <span class="text-4xl md:text-5xl font-black text-[#0B140D]">
                        25
                    </span>

                    <span class="text-gray-500 mb-1">
                        AED
                    </span>

                </div>

            </div>

            <!-- Capacity -->
            <div class="bg-white rounded-[28px] border-2 border-[#0B1F14] p-6 shadow-md">

                <p class="uppercase tracking-[0.2em] text-[11px] text-gray-500 mb-3">
                    Spots Left
                </p>

                <h3 class="text-4xl font-black text-[#0B140D]">
                    8
                </h3>

            </div>

        </div>

        <!-- Reservation Card -->
        <div class="bg-white rounded-[32px] border-2 border-[#0B1F14] p-6 md:p-8 shadow-lg">

            <!-- Heading -->
            <h2 class="text-3xl md:text-4xl font-black text-[#0B140D] mb-8">

                Reserve

                <span class="italic font-medium">
                    your spot
                </span>

            </h2>

            <!-- Name -->
            <div class="mb-5">

                <label class="block uppercase tracking-[0.2em] text-[11px] text-gray-500 mb-3">
                    Your Name *
                </label>

                <input
                    type="text"
                    placeholder="Nikunj"
                    class="w-full h-14 px-5 rounded-2xl border border-[#0B1F14]/20 bg-white text-[#0B140D] focus:outline-none focus:border-[#0B1F14] transition"
                >

            </div>

            <!-- Phone -->
            <div class="mb-6">

                <label class="block uppercase tracking-[0.2em] text-[11px] text-gray-500 mb-3">
                    Phone Number *
                </label>

                <input
                    type="text"
                    placeholder="+971 50 123 4567"
                    class="w-full h-14 px-5 rounded-2xl border border-[#0B1F14]/20 bg-white text-[#0B140D] focus:outline-none focus:border-[#0B1F14] transition"
                >

            </div>

            <!-- RSVP Button -->
            <button
                class="group w-full h-16 rounded-full bg-[#0B140D] hover:bg-[#12281b] transition-all duration-300 text-white text-lg md:text-xl font-semibold"
            >

                RSVP for 25 AED

                <span class="inline-block ml-2 group-hover:translate-x-1 transition-transform">
                    →
                </span>

            </button>

            <!-- Footer -->
            <div class="mt-5 text-center">

                <span class="uppercase tracking-[0.2em] text-[10px] text-gray-500">
                    Secured By
                </span>

                <span class="ml-2 font-black text-xl text-[#0B140D]">
                    ziina
                </span>

            </div>

        </div>

    </div>

</section>

</body>
</html>
